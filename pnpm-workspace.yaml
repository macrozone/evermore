packages:
  - "apps/*"
  - "packages/*"

catalogs:
  build-tools:
    "@catladder/cli": ^5.4.0
    turbo: ^2.11.6
    # typescript-eslint 8 supports TypeScript <6.1 – bump both together
    typescript: ~6.0.3
  compression:
    fflate: ^0.8.3
  linting:
    "@eslint/js": ^9.39.5
    # keep the major in sync with next in catalog:nextjs
    "@next/eslint-plugin-next": ^16.3.8
    # eslint-plugin-react does not support ESLint 10 yet
    eslint: ^9.39.5
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^7.1.1
    globals: ^17.13.0
    typescript-eslint: ^8.71.0
  nextjs:
    # keep the major in sync with @next/eslint-plugin-next in catalog:linting
    next: ^16.3.8
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
  styling:
    "@tailwindcss/postcss": ^4.3.3
    tailwindcss: ^4.3.3
  testing:
    # vitest needs vite as a peer – keep both within vitest's supported range
    vite: ^8.3.2
    vitest: ^5.0.3
  typescript-types:
    "@types/node": ^22.20.4

# dependency build scripts pnpm may run (pnpm 11 fails the install on unapproved ones)
allowBuilds:
  # esbuild (via tsx, used by @catladder/cli) installs its platform binary
  esbuild: true
